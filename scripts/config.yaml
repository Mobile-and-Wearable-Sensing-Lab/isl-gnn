# Data Configuration
data_root: "/Users/yashrb/Projects/isl-gnn/landmarks"  # Update this path
batch_size: 32
num_workers: 19
max_frames: 120  # Set to None to use all frames
normalize: false
use_world_landmarks: false
use_hand_landmarks: true

# Model Configuration
dropout: 0.4
edge_importance_weighting: true

# Training Configuration
epochs: 100
learning_rate: 0.001
weight_decay: 0.005
cosine_t_max: 100  # For cosine annealing
cosine_eta_min: 0.00001

# Logging Configuration
log_interval: 10  # Log every N batches
val_interval: 1  # Validate every N epochs
enable_wandb: true  # Enable/disable WandB logging

# WandB Configuration
wandb_project: "isl-stgcn"
wandb_run_name: "baseline"
wandb_entity: "yashrb" # Set to your WandB username/team if needed

# Data Augmentation Configuration
enable_augmentation: false # Master toggle for all augmentations
augmentation:
  probability: 0.3           # Base probability for each augmentation type
  rotation_range: 15.0       # ±degrees rotation
  scale_range: [0.8, 1.2]   # Min/max scaling factors
  translation_range: 0.1     # Translation as fraction of coordinate range
  noise_std: 0.02           # Gaussian noise standard deviation
  occlusion_prob: 0.1       # Probability of landmark occlusion

# Paths
checkpoint_dir: "./checkpoints"
save_model: false